name: crawl
# Обход mechta + evrika каждые 2 часа: оценка, Telegram, сохранение базы.
# База живёт в кэше Actions: обход восстанавливает самую свежую копию (по
# префиксу ключа) и сохраняет новую под уникальным ключом. Ветку data GitHub
# отклонил («remote: fatal error in commit_refs», 2026-09-13), а кэшу права
# на запись в репозиторий не нужны.
# Расписание снято 2026-09-13: mechta режет IP дата-центров GitHub (RECON,
# run 34765681139). Обход идёт с домашнего ПК из Планировщика Windows
# (deploy/install_task.ps1); здесь — только ручной запуск для проверки.
on:
  workflow_dispatch:

permissions:
  contents: read

# Единый writer: всё, что пишет базу, — одна группа (урок gpu-deals).
concurrency:
  group: db-writer
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      SKIDKI_DB: ${{ github.workspace }}/data/skidki.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: База из кэша
        id: db
        uses: actions/cache/restore@v4
        with:
          path: data/skidki.sqlite3
          key: skidki-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: skidki-db-

      - name: Состояние базы
        run: |
          mkdir -p data
          if [ -f "$SKIDKI_DB" ]; then
            ls -la "$SKIDKI_DB"
            echo "::notice title=База::восстановлена из ${{ steps.db.outputs.cache-matched-key }}"
          else
            echo "::notice title=База::кэша нет — холодный старт"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Кэш браузера Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Зависимости
        # dl.google.com в apt-источниках раннера периодически отдаёт hash
        # mismatch — ретрай через минуту решает (урок gpu-deals, 2026-09-09).
        run: |
          pip install .
          python -m playwright install --with-deps chromium \
            || { sleep 60; sudo apt-get update; python -m playwright install --with-deps chromium; }

      - name: Обход
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: skidki crawl

      - name: Сохранить базу
        # Наблюдения и недоставленные алерты переживают отказ Telegram.
        if: always() && hashFiles('data/skidki.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: data/skidki.sqlite3
          key: skidki-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Резервная копия базы
        # Страховка на случай потери кэша: базу можно скачать из артефакта запуска.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skidki-db
          path: data/skidki.sqlite3
          retention-days: 7
          if-no-files-found: ignore
