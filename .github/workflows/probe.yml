name: probe
# Диагностика доступа с IP раннера GitHub: варианты против Cloudflare на
# mechta и evrika, плюс проверка, что секреты Telegram заданы (без значений).
# Итоги — в аннотациях запуска (видны без входа). Запуск при push в probe/**
# и вручную (Actions → probe → Run workflow).
on:
  push:
    paths:
      - 'probe/**'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Кэш браузера Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Зависимости
        # dl.google.com в apt-источниках раннера периодически отдаёт hash
        # mismatch — ретрай через минуту решает (урок gpu-deals, 2026-09-09).
        run: |
          pip install .
          python -m playwright install --with-deps chromium \
            || { sleep 60; sudo apt-get update; python -m playwright install --with-deps chromium; }

      - name: Секреты Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -n "${!name}" ]; then
              echo "::notice title=Секреты::$name задан"
            else
              echo "::warning title=Секреты::$name НЕ задан"
            fi
          done

      - name: Проба
        run: python probe/cf_probe.py
