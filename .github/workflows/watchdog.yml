name: watchdog
# Независимый сторож: если обходы перестали приходить (парсер сломался,
# Cloudflare закрыл доступ, workflow отключили) — тишина в Telegram неотличима
# от «скидок нет». Сторож читает базу и сам будит владельца. Дважды в сутки:
# 06:00 и 18:00 UTC (11:00 и 23:00 по Алматы).
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKIDKI_DB: ${{ github.workspace }}/data/skidki.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: База из ветки data
        # Базы нет — сторож увидит «ни одного обхода» и поднимет тревогу, это верно.
        run: |
          mkdir -p data
          git fetch --depth=1 origin data && git show FETCH_HEAD:skidki.sqlite3 > "$SKIDKI_DB" \
            || echo "базы нет"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Зависимости
        run: pip install .

      - name: Проверка свежести обходов
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: skidki watchdog --max-age-hours 6
