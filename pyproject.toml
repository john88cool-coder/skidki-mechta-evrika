[project]
name = "skidki"
version = "0.1.0"
description = "Мониторинг скидок mechta.kz и evrika.com по собственной истории цен"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skidki = "skidki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skidki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
