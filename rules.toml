# Правила владельца. Файл читается на каждом обходе: правка + push, без кода.
#
# Сигналы:
#   «скидка магазина» — НОВАЯ скидка от deal_pct% к зачёркнутой цене;
#   «упало»           — цена ниже медианы за 14 дней на drop_pct процентов;
#   «минимум»         — ниже всего, что видели за 30 дней;
#   «цель»            — цена не выше max_price из правил ниже;
#   «в наличии»       — позиция с целью вернулась в продажу.

# Скидка магазина, в процентах от зачёркнутой цены. Бот пишет только о НОВЫХ
# скидках: товар впервые её получил, вернулся в продажу со скидкой или
# подешевел дальше. Скидки больше 90% считаются ошибкой цены.
deal_pct = 20
# Дешевле этой суммы скидкой не считается (чехлы, кабели, мелочь).
deal_min_price = 20000

# Общий порог «упало», в процентах. Агрессивный режим: лучше лишнее, чем пропущенное.
drop_pct = 7

# Категории: подстрока названия категории магазина (как на сайте), без регистра.
#   drop_pct  — свой порог «упало» для категории;
#   max_price — цель: любая позиция категории не дороже этой суммы присылается сразу.
#
# [[category]]
# match = "Смарт-часы"
# drop_pct = 5
# max_price = 60000

# Конкретные товары: подстрока названия и цена, при которой берёте.
#   shop — необязательно: mechta или evrika.
#
# [[watch]]
# query = "Galaxy Watch Ultra"
# max_price = 150000
# shop = "mechta"
